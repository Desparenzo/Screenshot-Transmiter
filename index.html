<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14171c">
<title>Screen Link</title>
<style>
  :root { color-scheme: dark; --bg:#14171c; --panel:#1d222a; --line:#2e3540; --text:#e6e9ee; --dim:#8b94a3; --accent:#5aa9ff; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; padding:22px; display:grid; place-items:center; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { width:min(100%,560px); display:grid; gap:18px; }
  header { text-align:center; display:grid; gap:7px; }
  h1 { margin:0; font-size:clamp(24px,5vw,32px); letter-spacing:-.5px; }
  header p { margin:0; color:var(--dim); }
  .choices { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  button { min-height:145px; padding:18px 14px; display:grid; align-content:center; justify-items:center; gap:9px; border:1px solid var(--line); border-radius:14px; background:var(--panel); color:var(--text); font:inherit; cursor:pointer; transition:border-color .15s,background .15s,transform .15s; }
  button:hover { border-color:var(--accent); background:#232c38; }
  button:active { transform:scale(.985); }
  .icon { font-size:35px; line-height:1; }
  .label { font-size:17px; font-weight:650; }
  .hint { color:var(--dim); font-size:12px; }
  footer { text-align:center; color:var(--dim); font-size:12px; }
  @media(max-width:420px) { body { padding:16px; } .choices { grid-template-columns:1fr; } button { min-height:118px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Screen Link</h1>
    <p>Which device are you using?</p>
  </header>
  <section class="choices" aria-label="Choose device type">
    <button type="button" id="pcBtn">
      <span class="icon" aria-hidden="true">🖥️</span>
      <span class="label">This device is PC</span>
      <span class="hint">Open screen sender</span>
    </button>
    <button type="button" id="phoneBtn">
      <span class="icon" aria-hidden="true">📱</span>
      <span class="label">This device is Phone</span>
      <span class="hint">Open screenshot receiver</span>
    </button>
  </section>
  <footer>Select the role you want this device to use.</footer>
</main>

function openApp(role) {
  const binary = atob(APPS[role]);
  const bytes = Uint8Array.from(binary, ch => ch.charCodeAt(0));
  const appHTML = new TextDecoder("utf-8").decode(bytes);
  document.open();
  document.write(appHTML);
  document.close();
}
